name: matematicadivertida
description: "Jogo educativo de matemática gamificado em Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔊 Áudio para efeitos sonoros e trilha
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ==========================================================
  # 🖼️ ATIVOS (Imagens, Sons e Ícones)
  # ==========================================================
  assets:
    # Registra toda a pasta de imagens, incluindo os 3 perfis
    - assets/images/
    # Se você for usar sons futuramente, basta criar a pasta e descomentar:
    # - assets/audio/

  # ==========================================================
  # 🔤 FONTES (Opcional)
  # ==========================================================
  # fonts:
  #   - family: GameFont
  #     fonts:
  #       - asset: assets/fonts/PressStart2P-Regular.ttf