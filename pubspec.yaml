name: matematicadivertida
description: "Jogo educativo de matemática gamificado em Flutter com arquitetura reativa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🧠 Gerenciamento de Estado (Removido o ^ para travar a versão local)
  provider: 6.1.2

  # 🔊 Áudio e Multimídia (Gamificação)
  audioplayers: ^6.0.0

  # 🎙️ Recursos de Acessibilidade por Voz
  flutter_tts: ^4.1.0
  speech_to_text: ^6.6.0

  # 💾 Persistência de Dados Local
  shared_preferences: ^2.2.3

  # 🔥 Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.2.1
  
  # 🏁 Utilidades e Visual
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  confetti: ^0.8.0
  
  # 🛠️ Annotations e Validações
  meta: ^1.11.0

dependency_overrides:
  # Isso força o Flutter a ignorar o que os outros pacotes pedem e usar apenas a 6.1.2
  provider: 6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sons/
    - assets/icons/