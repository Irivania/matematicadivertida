name: matematicadivertida
description: "Jogo educativo de matemática gamificado em Flutter com arquitetura reativa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  audioplayers: ^6.0.0
  
  # Atualizados para compatibilidade com Kotlin 2.1.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

  shared_preferences: ^2.5.5

  # Firebase atualizado para versões estáveis
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0

  qr_flutter: ^4.1.0
  intl: ^0.20.3
  confetti: ^0.8.0
  google_fonts: ^8.2.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sons/
    - assets/icons/