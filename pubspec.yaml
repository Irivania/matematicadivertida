name: matematicadivertida
description: "Jogo educativo de matemática gamificado em Flutter com arquitetura reativa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🧠 Gerenciamento de Estado (Obrigatório para o GameState e JogoScreen)
  provider: ^6.1.1

  # 🔊 Áudio e Multimídia (Essencial para Gamificação)
  audioplayers: ^6.1.0

  # 💾 Persistência de Dados Local (Cache e Configurações)
  shared_preferences: ^2.2.2

  # 🔥 Firebase Core e Auth (Segurança e Sincronização em Nuvem)
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  google_sign_in: ^6.2.1
  
  # 🏁 Utilidades e QR Code
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Lints para manter o código limpo e seguindo padrões sênior
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Gerenciamento de Assets (Organizado por subpastas para escalabilidade)
  assets:
    - assets/images/
    - assets/sons/
    - assets/icons/

  # Fontes customizadas (Descomente se for utilizar fontes estilo Gamer/Neon)
  # fonts:
  #   - family: Orbitron
  #     fonts:
  #       - asset: assets/fonts/Orbitron-Regular.ttf
  #       - asset: assets/fonts/Orbitron-Bold.ttf
  #         weight: 700