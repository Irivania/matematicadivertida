name: matematicadivertida
description: "Jogo educativo de matemática gamificado em Flutter com arquitetura reativa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🧠 Gerenciamento de Estado
  provider: 6.1.2

  # 🔊 Áudio e Multimídia
  audioplayers: ^6.0.0

  # 🎙️ Voz e acessibilidade
  flutter_tts: ^4.1.0
  speech_to_text: ^6.6.0

  # 💾 Persistência local
  shared_preferences: ^2.5.5

  # 🔥 Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.2.1

  # 🏁 Recursos visuais
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  confetti: ^0.8.0

  # ✨ FONTES MODERNAS
  google_fonts: ^6.2.1

  # 🛠️ Utilidades
  meta: ^1.11.0

dependency_overrides:
  provider: 6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sons/
    - assets/icons/