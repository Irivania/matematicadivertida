name: matematicadivertida
description: "Jogo educativo de matemática gamificado em Flutter com arquitetura reativa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🧠 Gerenciamento de Estado
  provider: ^6.1.1

  # 🔊 Áudio e Multimídia (Gamificação)
  audioplayers: ^6.1.0

  # 🎙️ Recursos de Acessibilidade por Voz
  flutter_tts: ^4.2.2
  speech_to_text: ^6.6.0

  # 💾 Persistência de Dados Local
  shared_preferences: ^2.3.2

  # 🔥 Firebase (Versões sincronizadas para evitar conflitos de '_flutterfire_internals')
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.2
  google_sign_in: ^6.2.2
  
  # 🏁 Utilidades e Visual
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  confetti: ^0.8.0
  
  # 🛠️ Annotations e Validações
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Lints para manter o padrão de código sênior
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Gerenciamento de Assets (Garante que o Flutter encontre os arquivos)
  assets:
    - assets/images/
    - assets/sons/
    - assets/icons/