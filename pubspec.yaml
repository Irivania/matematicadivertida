name: matematicadivertida
description: "Jogo educativo de matemática gamificado em Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Versão mais compatível para garantir estabilidade

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔊 Áudio para efeitos sonoros e trilha
  audioplayers: ^6.1.0

  # 💾 Persistência de dados local
  shared_preferences: ^2.2.2

  # 🔥 Firebase (Versões testadas para trabalharem juntas)
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  google_sign_in: ^6.2.1
  
  # 🏁 Utilidades
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/